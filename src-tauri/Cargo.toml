[package]
name = "fini"
version = "0.3.6"
description = "Fini"
authors = []
edition = "2021"
autobins = false
default-run = "fini-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fini"
path = "src/cli.rs"
required-features = ["cli-plane"]

[[bin]]
name = "fini-app"
path = "src/desktop.rs"
required-features = ["ui-plane"]

[patch.crates-io]
sherpa-onnx-sys = { path = "patches/sherpa-onnx-sys" }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
diesel = { version = "2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sherpa-onnx = "0.1.9"
sherpa-onnx-sys = "0.1.9"
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
tokio-tungstenite = "0.26"
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"], optional = true }
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "signatures"], optional = true }
zipsign-api = { version = "0.1", default-features = false, features = ["verify-tar", "verify-zip"], optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-notification = { version = "2.3.3", optional = true }
tauri-plugin-autostart = { version = "2.5.1", optional = true }
time = { version = "0.3.47", features = ["parsing", "formatting"] }
tauri-plugin-playwright = { version = "0.2", optional = true }
socket2 = "0.6"
mdns-sd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-log = { version = "2", optional = true }
url = { version = "2", optional = true }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", optional = true }
notify-rust = { version = "4", optional = true }
ble-gatt = { git = "https://github.com/VRuzhentsov/ble-gatt", rev = "4139db405738194e7bc18915c7c9b977ded12ccf" }
# Only used behind #[cfg(target_os = "linux")] (resume_watcher's sleep/wake
# watcher, settings.rs's portal theme-change watcher, both over the
# session/system D-Bus) -- kept target-gated rather than unconditional so
# Windows/macOS builds don't pull in zbus's Windows uds_windows backend at
# all, which has no reason to be exercised there and can independently break
# on its own dependency drift (windows-sys versions dropping `core::BOOL`).
zbus = { version = "5.14.0", features = ["blocking-api"] }
zvariant = "5.10.0"

[target.'cfg(target_os = "android")'.dependencies]
ble-gatt = { git = "https://github.com/VRuzhentsov/ble-gatt", rev = "4139db405738194e7bc18915c7c9b977ded12ccf" }
tao = "0.35"
ndk-context = "0.1"
tokio-stream = "0.1"
jni = "0.21"

[features]
default = []
ui-plane = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-notification", "dep:tauri-plugin-autostart", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-log", "dep:gtk", "dep:notify-rust"]
desktop-updater = ["ui-plane", "dep:tauri-plugin-updater", "dep:url"]
cli-plane = ["dep:clap", "dep:self_update", "dep:url", "dep:zipsign-api"]
# Enable developer/test control-plane hooks. Off by default; production builds
# must not ship this because it exposes an in-process Playwright socket bridge.
devtools = ["dep:tauri-plugin-playwright", "ble-gatt/mock-broker"]
