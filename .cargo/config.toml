# The voice input (sherpa-onnx) links the C++ runtime of the NDK on Android.
# The folders of the sherpa-onnx libraries come from SHERPA_ONNX_LIB_DIR and
# SHERPA_ONNX_LIB_DIR_ANDROID* (src-tauri/patches/sherpa-onnx-sys/build.rs),
# not from this file, so that no build has the paths of one computer.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-lc++_shared"]
