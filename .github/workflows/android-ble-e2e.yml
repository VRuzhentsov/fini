# Two virtual phones on one virtual Bluetooth medium (ADR-0013), defined once.
# The pull-request run (ci.yml) and the release run (release-tag.yml) call
# this file. Not a required check yet (D5): it becomes one after about ten
# green runs. Until then a failure does not stop a release.
name: Android BLE E2E

on:
  workflow_call:
    inputs:
      non_blocking:
        description: A failure of the lane shows as a warning and does not fail the caller.
        type: boolean
        default: false
      push_cache:
        description: >-
          Whether this caller may push the android-phones-runner image to GHCR.
          False for pull requests from forks, whose token cannot write packages.
        type: boolean
        default: true

jobs:
  android-ble-e2e:
    name: Android BLE E2E
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.non_blocking }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # See the android-emulator-e2e job in ci.yml: the default `tools` package is gone.
          packages: platform-tools

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 Android Rust target
        run: rustup target add x86_64-linux-android

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: android-emulator-e2e-rust

      - name: Install npm dependencies
        run: npm ci

      - name: Build x86_64 debug APK with devtools
        run: npm run build:android:e2e

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Podman reads the credentials that this action writes for Docker.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run the android-ble lane
        # The same command as on a developer's computer (ADR-0013 D8). It
        # pulls the android-phones-runner image from GHCR, or builds and
        # pushes it when the Dockerfile changed, and runs Playwright in it.
        env:
          FINI_E2E_KEEP: "1"
          FINI_ANDROID_PHONES_CACHE_PREFIX: ghcr.io/${{ github.repository }}
          FINI_ANDROID_PHONES_CACHE_PUSH: ${{ inputs.push_cache && '1' || '0' }}
        run: npm run test:e2e:android-ble

      - name: Show the free disk space
        # The runner disk was too small for Quality Gates before; this records
        # what the lane leaves.
        if: always()
        run: df -h /

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ble-e2e-results
          path: |
            tmp/fini-e2e-multi-device/
            specs/e2e/test-results/
          if-no-files-found: ignore
