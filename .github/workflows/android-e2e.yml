# The Fini APK on two virtual phones that share one virtual Bluetooth medium
# (ADR-0013), defined once. It checks the app start and the notification
# channel, and a Bluetooth pairing between the phones.
# The pull-request run (ci.yml) and the release run (release-tag.yml) call
# this file. Not a required check yet (D5): it becomes one after about ten
# green runs. Until then a failure does not stop a release.
name: Android E2E

on:
  workflow_call:
    inputs:
      non_blocking:
        description: A failure of the job shows as a warning and does not fail the caller.
        type: boolean
        default: false
      push_cache:
        description: >-
          Whether this run writes the GHCR layer cache of the android image.
          True only for a pull request from a branch of this repository;
          release, dispatch and fork runs only read the cache. The caller that
          gives true also gives `packages: write`.
        type: boolean
        default: false

jobs:
  android-e2e:
    name: Android E2E
    # The JDK, the Android SDK and NDK, Rust with the Android targets, Node
    # and the emulator come from the `android` image
    # (containers/android/Containerfile), not from the runner.
    runs-on: ubuntu-26.04
    continue-on-error: ${{ inputs.non_blocking }}
    # No `permissions:` here: the job gets the ones of the caller. ci.yml gives
    # `packages: write` for the cache; release-tag.yml gives read only.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The android images are large (build about 8.4 GB, e2e about 10.8 GB),
      # and the APK compiles from scratch in the container; the runner's
      # preinstalled SDKs leave too little disk for that. The Android SDK of
      # the runner is not used: the image has its own.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false
          large-packages: false

      - name: Restore Android project cache
        uses: actions/cache@v4
        with:
          path: src-tauri/gen/android/.gradle
          key: android-e2e-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/gradle.properties', 'src-tauri/gen/android/settings.gradle', 'src-tauri/gen/android/build.gradle.kts', 'src-tauri/gen/android/app/build.gradle.kts', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            android-e2e-${{ runner.os }}-

      - name: Build x86_64 debug APK with devtools
        uses: ./.github/actions/podman-stage
        with:
          image: android
          stage: build
          push-cache: ${{ inputs.push_cache }}
          run: npm ci && npm run build:android:e2e

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device-support on virtual Android
        # The same command as on a developer's computer (ADR-0013 D8), in the
        # `android` `e2e` stage. FINI_E2E_CONTAINER_RUNNER=1 makes
        # scripts/e2e-android.mts run Playwright at once, as it does in the
        # container that it starts on a developer's computer.
        uses: ./.github/actions/podman-stage
        env:
          FINI_E2E_KEEP: "1"
          FINI_E2E_CONTAINER_RUNNER: "1"
        with:
          image: android
          stage: e2e
          push-cache: ${{ inputs.push_cache }}
          pass-env: FINI_E2E_KEEP FINI_E2E_CONTAINER_RUNNER
          # --shm-size: with the default 64 MB of /dev/shm the emulator crashes
          # (SIGSEGV) at start.
          podman-args: --device /dev/kvm --shm-size=2g
          run: npm run test:e2e:android

      - name: Show the free disk space
        # The runner disk was too small for Quality Gates before; this records
        # what the job leaves.
        if: always()
        run: df -h /

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results
          path: |
            tmp/fini-e2e-multi-device/
            specs/e2e/test-results/
          if-no-files-found: ignore
