# The gate, defined once.
#
# Both the pull-request run and the release run call this file, so what CI
# proves is what the release will do -- not something close to it.
#
# That property was missing and it cost a release. The commands matched,
# but the release ran them as one long job on a single hosted runner while
# CI split them across fresh ones, so the release machine reached the E2E
# suite with its memory and disk already spent. Races appeared there that
# the pull request never showed, on the same commit, and a green PR
# promised nothing.
#
# The shape here is the release's, deliberately: the stricter of the two.
# Making the release softer to match CI would have removed the divergence
# by hiding the failure, which is the wrong direction -- the point is that
# CI fails wherever the release would.
name: Quality Gates

on:
  workflow_call:
    inputs:
      push_cache:
        description: >-
          Whether this run writes the GHCR layer cache. True only for a pull
          request from a branch of this repository; release, dispatch and fork
          runs only read the cache. The caller that gives true also gives
          `packages: write`.
        type: boolean
        default: false
      run_id_prefix:
        description: Distinguishes one caller's E2E run directory from another's.
        type: string
        default: gate

# The Node, Rust and system packages of the gate come from the `linux` image
# (containers/linux/Containerfile), not from the runner, so a runner image
# bump does not move the gate off the release's toolchain. The runner gives
# only podman, and the Node for `npm version` below.
env:
  # A build from scratch gains nothing from incremental files, and line tables
  # are enough for test panics; both keep the build inside the runner's disk.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-26.04
    # No `permissions:` here: the job gets the ones of the caller. ci.yml gives
    # `packages: write` for the cache; the release workflows give read only.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Only meaningful when the ref is a release tag. On a pull request
      # `GITHUB_REF_NAME` is a branch, and `npm version <branch>` would
      # fail -- so this is skipped there rather than made to guess. The
      # tagged commit is supposed to carry the release version already
      # (see the release policy); this stays as CI's defence against a tag
      # that does not.
      - name: Sync project version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          sed -i -E '/^\[package\]/,/^\[/{s/^version = ".*"/version = "'"$version"'"/}' src-tauri/Cargo.toml
          sed -i -E '/^name = "fini"$/,/^version = /{s/^version = ".*"/version = "'"$version"'"/}' src-tauri/Cargo.lock
          sed -i -E '0,/"version": "[^"]+"/{s//"version": "'"$version"'"/}' src-tauri/tauri.conf.json
          grep -q "\"version\": \"$version\"" package.json
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml
          grep -q "^version = \"$version\"" src-tauri/Cargo.lock
          grep -q "\"version\": \"$version\"" src-tauri/tauri.conf.json

      # The backend tests compile from scratch in the container; the runner's
      # preinstalled SDKs leave too little disk for that.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false
          large-packages: false

      - name: Compile backend tests
        uses: ./.github/actions/podman-stage
        with:
          image: linux
          stage: build
          push-cache: ${{ inputs.push_cache }}
          pass-env: CARGO_INCREMENTAL CARGO_PROFILE_DEV_DEBUG
          run: cargo test --manifest-path src-tauri/Cargo.toml --no-run --features cli-plane,ui-plane,desktop-updater

      - name: Run backend tests
        uses: ./.github/actions/podman-stage
        with:
          image: linux
          stage: build
          pass-env: CARGO_INCREMENTAL CARGO_PROFILE_DEV_DEBUG
          run: cargo test --manifest-path src-tauri/Cargo.toml --features cli-plane,ui-plane,desktop-updater

      - name: Build CLI container image
        id: cli_image
        uses: ./.github/actions/podman-stage
        with:
          image: linux
          stage: runtime
          push-cache: ${{ inputs.push_cache }}

      - name: Run CLI image smoke check
        env:
          IMAGE: ${{ steps.cli_image.outputs.image }}
        run: podman run --rm "$IMAGE" --help

      # The `linux` `e2e` stage gives the toolchain, Playwright, Xvfb and the
      # GUI libraries. `gate:e2e:run` builds the e2e binaries in it and runs
      # scripts/e2e-runner.sh (FINI_E2E_CONTAINER_RUNNER=1).
      - name: Run desktop e2e flow
        uses: ./.github/actions/podman-stage
        env:
          FINI_E2E_CONTAINER_RUNNER: "1"
          FINI_E2E_CI_RUN_ID: ${{ inputs.run_id_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          image: linux
          stage: e2e
          push-cache: ${{ inputs.push_cache }}
          pass-env: CARGO_INCREMENTAL CARGO_PROFILE_DEV_DEBUG FINI_E2E_CONTAINER_RUNNER FINI_E2E_CI_RUN_ID
          run: npm ci && npm run gate:e2e:run

      - name: Print E2E artifacts on failure
        if: failure()
        uses: ./.github/actions/podman-stage
        env:
          FINI_E2E_CI_RUN_ID: ${{ inputs.run_id_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          image: linux
          stage: e2e
          pass-env: FINI_E2E_CI_RUN_ID
          run: npm run gate:e2e:artifacts
