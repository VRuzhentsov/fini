name: CI

on:
  pull_request:
    branches:
      - main
    # ready_for_review starts CI the moment a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect App Changes
    # A draft PR is work in progress: CI starts when it is marked ready.
    # Every other job needs this one, so skipping it skips them all.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed app inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - '.github/workflows/ci.yml'
              # The gate itself lives in its own file now. Without this line a
              # pull request that changes only the gate reads as "no app
              # change" and skips every check -- including the gate it edits.
              - '.github/workflows/quality-gates.yml'
              - 'Dockerfile'
              - 'Makefile'
              - 'com.fini.app.yml'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'scripts/**'
              - 'specs/**'
              - 'src/**'
              - 'src-tauri/**'
              - 'xtask/**'
              - 'ble-mock-broker/**'


  fe-unit-tests:
    name: FE Unit Tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run frontend unit tests
        env:
          CONTAINER: docker
        run: npm run gate:fe-unit

  # The release's own gate, run here so a green pull request means a green
  # release rather than something close to it.
  #
  # This replaces what used to be three separate jobs -- BE Unit Tests, BE
  # Compile and E2E Tests -- each on its own clean runner. That split was
  # the whole problem: the release runs them together on one runner, and
  # reached the E2E suite with its memory and disk already spent, so it
  # failed on races CI could not produce on the same commit. Matching the
  # release's shape is the point; running the pieces somewhere easier
  # proves nothing about the thing that ships.
  quality-gates:
    name: Quality Gates
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/quality-gates.yml
    with:
      # A fork's token cannot write packages, so it reads the cache without
      # pushing to it.
      push_cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      run_id_prefix: ci

  desktop-bundle-linux:
    name: Desktop Bundle (Linux x64)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: pr-desktop-bundle-linux

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare AppImage GTK bundler
        run: scripts/prepare-tauri-linuxdeploy-gtk-plugin.sh

      # `createUpdaterArtifacts: true` in tauri.conf.json means `tauri build`
      # requires *some* signing key to be present or it refuses to bundle at
      # all -- but this job only needs to prove the bundle assembles, not
      # produce a real updater artifact, so a throwaway keypair generated
      # fresh in this job is enough. Do NOT use the real
      # TAURI_SIGNING_PRIVATE_KEY/_PASSWORD secrets here: those are the
      # production updater signing key, meant to be decrypted only for a
      # trusted release (workflow_dispatch or a signed tag push, both
      # maintainer-controlled) -- this job runs on every pull_request, whose
      # checked-out code (via beforeBuildCommand) executes before a human
      # reviews it, so wiring the real key in here would let a PR exfiltrate
      # it.
      - name: Generate ephemeral signing key (PR bundle check only)
        # `tauri build`'s own updater-artifact auto-signing step only reads
        # TAURI_SIGNING_PRIVATE_KEY as literal key content (confirmed: the
        # _PATH variant is accepted by the standalone `tauri signer sign`
        # command but not by this step -- "A public key has been found, but
        # no private key" even with _PATH set to a valid file). No exposure
        # concern threading this one through $GITHUB_ENV: it's regenerated
        # every run and never used for anything but this job.
        run: |
          set -euo pipefail
          CI=1 npx tauri signer generate --ci -w "$RUNNER_TEMP/pr-bundle-verify.key" -p ""
          { echo "TAURI_SIGNING_PRIVATE_KEY<<KEYEOF"; cat "$RUNNER_TEMP/pr-bundle-verify.key"; echo; echo "KEYEOF"; } >> "$GITHUB_ENV"

      # Same command release-tag.yml/release-dry-run.yml use to build the
      # real Linux desktop bundle, so any binary this crate declares (see
      # src-tauri/Cargo.toml's `[[bin]]` list) that can't actually be
      # produced with the release feature set fails here, on every PR --
      # not only when a real release tag is pushed. Caught exactly this way
      # once already: a devtools-only `[[bin]]` (`ble-mock-broker`) broke
      # every desktop bundle job in the v0.3.5 release because Tauri's
      # bundler sweeps every declared `[[bin]]` into the bundle regardless
      # of which features actually built it. Fixed by moving that binary to
      # its own crate (see ble-mock-broker/Cargo.toml); this job exists so
      # the next binary like it fails a PR instead of a release.
      - name: Build Linux bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --features ui-plane,desktop-updater --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm -- --bin fini-app

      - name: Verify AppImage host runtime boundary
        run: |
          set -euo pipefail
          appimage="$(find "src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage" -type f -name '*.AppImage' -print -quit)"
          if [ -z "$appimage" ]; then
            echo "Expected AppImage was not produced" >&2
            exit 1
          fi
          scripts/verify-appimage-host-runtime.sh "$appimage"

  # x64 only, not the full arch matrix release-tag.yml builds -- a
  # `cfg(target_os = "windows")`-class compile break (the reason this job
  # exists) doesn't vary by architecture, and windows-11-arm runners are
  # scarcer/costlier for no extra signal here. Mirrors desktop-bundle-linux's
  # own reasoning: v0.3.7's release tag shipped a Windows-only compile error
  # (an unguarded `transport::ble` reference -- that module is
  # linux/android-only) that PR CI never touched, because nothing here built
  # for Windows at all. Since the release workflow's publish gate waits on
  # *every* platform artifact, that one Windows failure blocked the whole
  # release -- including Linux desktop, which had compiled fine on its own.
  # This job exists so the next break like it fails a PR instead of quietly
  # blocking a release days later.
  desktop-bundle-windows:
    name: Desktop Bundle (Windows x64)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: pr-desktop-bundle-windows

      - name: Install npm dependencies
        run: npm ci

      # Same ephemeral-key reasoning as desktop-bundle-linux's own step: this
      # job runs on every pull_request, whose checked-out code executes
      # before a human reviews it, so the real production
      # TAURI_SIGNING_PRIVATE_KEY/_PASSWORD secrets must never be wired in
      # here.
      - name: Generate ephemeral signing key (PR bundle check only)
        shell: bash
        run: |
          set -euo pipefail
          CI=1 npx tauri signer generate --ci -w "$RUNNER_TEMP/pr-bundle-verify.key" -p ""
          { echo "TAURI_SIGNING_PRIVATE_KEY<<KEYEOF"; cat "$RUNNER_TEMP/pr-bundle-verify.key"; echo; echo "KEYEOF"; } >> "$GITHUB_ENV"

      # Same command release-tag.yml uses to build the real Windows desktop
      # bundle (minus the NSIS artifact staging/zipsign steps, which need
      # the real production secrets and add no compile-correctness signal).
      - name: Build Windows bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --features ui-plane,desktop-updater --target x86_64-pc-windows-msvc --bundles nsis -- --bin fini-app

      # A separate `[[bin]]` target (`cli-plane` feature, not `ui-plane`) --
      # a distinct compilation unit from the bundle above, so it needs its
      # own check to catch a Windows-only break specific to the CLI binary.
      - name: Build Windows CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --bin fini --features cli-plane --target x86_64-pc-windows-msvc

  # Two virtual phones on one virtual Bluetooth medium (ADR-0013); the job is
  # in android-e2e.yml, which the release calls too.
  android-e2e:
    name: Android E2E
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/android-e2e.yml
    with:
      # A fork's token cannot write packages, so it reads the cache without
      # pushing to it.
      push_cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
